name: android-ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 说明：GitHub Actions 自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不再使用 android-actions/setup-android（其当前版本与新预装 sdkmanager 不兼容，
      # 会在许可证接受交互处卡死）。本地缺的 build-tools/platform 由 Gradle 按 sdk 缓存自动补齐，
      # AGP 在编译时按需安装。

      - name: Prepare release signing keystore
        env:
          QA_KEYSTORE_B64: ${{ secrets.QA_KEYSTORE_B64 }}
        run: |
          if [ -n "$QA_KEYSTORE_B64" ]; then
            echo "$QA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/qa-release.keystore"
            echo "KEYSTORE_READY=true" >> "$GITHUB_ENV"
            echo "签名密钥已就绪（PKCS12，专用 keystore）"
          else
            echo "KEYSTORE_READY=false" >> "$GITHUB_ENV"
            echo "::warning::QA_KEYSTORE_B64 未配置，release 包将退回 debug 签名"
          fi

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Release build (signed)
        env:
          QA_KEYSTORE_PATH: ${{ runner.temp }}/qa-release.keystore
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
          QA_KEYSTORE_ALIAS: quickappguard
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QuickAppGuard-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
